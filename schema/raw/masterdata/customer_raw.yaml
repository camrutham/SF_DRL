table_name: CUSTOMER_RAW

schema: SALES_RAW

description: Customer master raw table.

source:
  table: CUSTOMER

columns:

  - name: CUSTOMER_ID
    type: NUMBER(38,0)
    nullable: false
    description: Customer identifier

  - name: CUSTOMER_NUMBER
    type: VARCHAR(30)
    nullable: false
    description: Business customer number

  - name: CUSTOMER_NAME
    type: VARCHAR(200)
    nullable: false
    description: Customer name

  - name: CUSTOMER_TYPE
    type: VARCHAR(50)
    nullable: true

  - name: INDUSTRY
    type: VARCHAR(100)
    nullable: true

  - name: ADDRESS
    type: VARCHAR(500)
    nullable: true

  - name: CITY
    type: VARCHAR(100)
    nullable: true

  - name: STATE
    type: VARCHAR(100)
    nullable: true

  - name: COUNTRY
    type: VARCHAR(100)
    nullable: true

  - name: EMAIL
    type: VARCHAR(255)
    nullable: true

  - name: PHONE
    type: VARCHAR(30)
    nullable: true

  - name: DATE_CREATED
    type: TIMESTAMP_NTZ
    nullable: false

  - name: DATE_UPDATED
    type: TIMESTAMP_NTZ
    nullable: false

primary_key:
  columns:
    - CUSTOMER_ID

partition_columns:
  - DATE_UPDATED

clustering_keys:
  - CUSTOMER_ID
  - DATE_UPDATED
table_name: CONTRACT_RAW

schema: sales_raw

description: Contract master raw table.

source:
  table: CONTRACT

columns:

  - name: CONTRACT_ID
    type: NUMBER(38,0)
    nullable: false
    description: Unique contract identifier

  - name: CONTRACT_NUMBER
    type: VARCHAR(30)
    nullable: false
    description: Business contract number

  - name: CONTRACT_NAME
    type: VARCHAR(200)
    nullable: false
    description: Contract name

  - name: CUSTOMER_ID
    type: NUMBER(38,0)
    nullable: false
    description: Customer identifier

  - name: CONTRACT_TYPE
    type: VARCHAR(50)
    nullable: true
    description: Contract type

  - name: START_DATE
    type: DATE
    nullable: true
    description: Contract start date

  - name: END_DATE
    type: DATE
    nullable: true
    description: Contract end date

  - name: CONTRACT_VALUE
    type: NUMBER(18,2)
    nullable: true
    description: Contract value

  - name: CONTRACT_STATUS
    type: VARCHAR(30)
    nullable: true
    description: Contract status

  - name: SALES_REGION
    type: VARCHAR(100)
    nullable: true
    description: Sales region

  - name: ACCOUNT_MANAGER
    type: VARCHAR(100)
    nullable: true
    description: Account manager

  - name: DATE_CREATED
    type: TIMESTAMP_NTZ
    nullable: false
    description: Source record creation timestamp

  - name: DATE_UPDATED
    type: TIMESTAMP_NTZ
    nullable: false
    description: Source record last update timestamp

primary_key:
  columns:
    - CONTRACT_ID

partition_columns:
  - DATE_UPDATED

clustering_keys:
  - CONTRACT_ID
  - CUSTOMER_ID
  - DATE_UPDATED